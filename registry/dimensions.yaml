# The skills Najma measures (docs/plan/05: the plan's 16, plus any added since). Source of truth for the UI, the scorer and the agent.
# Which games measure a skill, and how strongly, lives in each game's file (registry/games/*.yaml).
# `group` places the skill's constellation in the night sky (docs/plan/13).

- id: selective_attention
  name: Selective attention
  plain: Focusing on what matters
  badge: established
  in_overall: true
  group: attention
  framework: [CHC:Gs, NIH:flanker, NCPT:selective_attention]
  main_metric: Flanker RT cost; search slope (ms per item)
  forecast_family: 1  # Lumosity master game: Lost in Migration (docs/plan/10)
  biases: [screen size, device lag, speed vs accuracy trade-off]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8

- id: sustained_attention
  name: Sustained attention
  plain: Staying alert over time
  badge: established
  in_overall: true
  group: attention
  framework: [CHC:Gs]
  main_metric: Hits, false alarms, d-prime, RT variability
  biases: [boredom, noisy room]
  sources:
    - https://doi.org/10.1080/17470214808416738  # Mackworth 1948, the breakdown of vigilance
    - https://doi.org/10.1016/S0028-3932(97)00015-8  # Robertson et al. 1997, the SART

- id: divided_attention
  name: Divided attention
  plain: Doing two things at once
  badge: moderate
  in_overall: true
  group: attention
  framework: [NCPT:divided_attention]
  main_metric: Dual-task cost (% drop vs single task)
  forecast_family: 20  # Lumosity master game: Playing Koi (docs/plan/10)
  biases: [strategy learning]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8

- id: inhibition
  name: Inhibition
  plain: Holding back an automatic response
  badge: established
  in_overall: true
  group: control
  framework: [Miyake:inhibition, NIH:flanker, NCPT:response_inhibition]
  main_metric: Stroop effect, commission errors, SSRT
  forecast_family: 2  # Lumosity master game: Color Match (docs/plan/10)
  biases: [reading fluency with English colour words]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8
    - https://doi.org/10.1006/cogp.1999.0734  # Miyake et al. 2000, executive functions
    - https://doi.org/10.3758/s13428-017-0935-1  # Hedge et al. 2018, the reliability paradox

- id: working_memory
  name: Working memory
  plain: Holding information in mind and using it
  badge: established
  in_overall: true
  group: memory
  framework: [CHC:Gwm, Miyake:updating, NIH:list_sorting, NCPT:working_memory]
  main_metric: d-prime by n, span
  forecast_family: 10  # Lumosity master game: Memory Match (docs/plan/10)
  biases: [chunking strategy, practice gains on n-back]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8
    - https://doi.org/10.1006/cogp.1999.0734  # Miyake et al. 2000, executive functions

- id: short_term_memory
  name: Short-term memory
  plain: Remembering what you just saw
  badge: established
  in_overall: true
  group: memory
  framework: [CHC:Gwm, NIH:picture_sequence_memory, NCPT:visuospatial_memory]
  main_metric: Items recalled, recognition d-prime
  forecast_family: 4  # Lumosity master game: Memory Matrix (docs/plan/10)
  biases: [language, repeated lists (use fresh content)]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8

- id: processing_speed
  name: Processing speed
  plain: Speed on simple tasks
  badge: established
  in_overall: true
  group: speed
  framework: [CHC:Gs, NIH:pattern_comparison, NCPT:psychomotor_speed]
  main_metric: Median RT, items per minute
  forecast_family: 6  # Lumosity master game: Speed Match (docs/plan/10)
  biases: [device latency, motor speed]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8

- id: cognitive_flexibility
  name: Cognitive flexibility
  plain: Switching between rules
  badge: established
  in_overall: true
  group: control
  framework: [Miyake:shifting, NIH:card_sort]
  main_metric: Switch cost, perseverative errors
  forecast_family: 3  # Lumosity master game: Brain Shift (docs/plan/10)
  biases: [card sort loses meaning on repeat once the trick is known]
  sources:
    - https://doi.org/10.1006/cogp.1999.0734  # Miyake et al. 2000, executive functions
    - https://doi.org/10.1016/S1364-6613(03)00028-7  # Monsell 2003, task switching

- id: planning
  name: Planning
  plain: Thinking ahead
  badge: moderate
  in_overall: true
  group: reasoning
  framework: [CHC:Gf]
  main_metric: Percent optimal solutions, planning time, extra moves
  forecast_family: 29  # Lumosity master game: Route to Sprout (docs/plan/10)
  biases: [trial-and-error strategies]
  sources:
    - https://doi.org/10.1098/rstb.1982.0082  # Shallice 1982, the Tower of London
    - https://doi.org/10.1080/713755681  # Ward & Allport 1997, five-disc Tower of London

- id: reasoning
  name: Reasoning
  plain: Logic and patterns
  badge: established
  in_overall: true
  group: reasoning
  framework: [CHC:Gf, NCPT:abstract_reasoning]
  main_metric: Accuracy by item difficulty
  forecast_family: 18  # Lumosity master game: By the Rules (docs/plan/10)
  biases: [item memorisation (generate fresh items, solver-checked)]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8

- id: spatial_thinking
  name: Spatial thinking
  plain: Imagining shapes and places
  badge: established
  in_overall: true
  group: reasoning
  framework: [CHC:Gv, NCPT:visuospatial_memory]
  main_metric: Angle-RT slope, accuracy, span
  forecast_family: 17  # Lumosity master game: Penguin Pursuit (docs/plan/10)
  biases: [prior gaming experience]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8

- id: verbal_skill
  name: Verbal skill
  plain: Working with words
  badge: moderate
  in_overall: true
  group: language
  framework: [CHC:Gc, CHC:Gr]
  main_metric: Words per minute, solutions
  forecast_family: 13  # Lumosity master game: Word Bubbles (docs/plan/10)
  biases: [the English-only rule disadvantages Arabic and French speakers]
  note: Tasks are in English, which puts Arabic and French speakers at a disadvantage.
  sources:
    - https://doi.org/10.1016/j.intell.2008.08.004  # McGrew 2009, CHC theory (Gc, Gr)
    - https://doi.org/10.1037/0894-4105.11.1.138  # Troyer et al. 1997, verbal fluency

- id: numerical_thinking
  name: Numerical thinking
  plain: Feel for numbers
  badge: established
  in_overall: true
  group: language
  framework: [CHC:Gq, NCPT:numerical_calculation]
  main_metric: Percent absolute error, RT
  forecast_family: 12  # Lumosity master game: Raindrops (docs/plan/10)
  biases: [maths worry, schooling]
  sources:
    - https://www.nature.com/articles/s41597-022-01872-8

- id: decision_style
  name: Decision style under risk
  plain: Cautious or bold
  badge: moderate
  in_overall: false
  style: true
  group: style
  framework: [BART, IGT]
  main_metric: Adjusted pumps, advantageous choices
  biases: [learning the task vs risk preference]
  note: Shown as a style, not as better or worse.
  sources:
    - https://doi.org/10.1037/1076-898X.8.2.75  # Lejuez et al. 2002, the BART
    - https://doi.org/10.1016/0010-0277(94)90018-3  # Bechara et al. 1994, the gambling task

- id: accuracy_awareness
  name: Self-awareness of accuracy
  plain: Knowing when you're right
  badge: experimental
  in_overall: false
  group: style
  framework: [metacognition]
  main_metric: Calibration error, Brier score
  biases: [needs many answers, linked to accuracy]
  sources:
    - https://doi.org/10.3389/fnhum.2014.00443  # Fleming & Lau 2014, how to measure metacognition

- id: creativity
  name: Creativity
  plain: Coming up with ideas
  badge: experimental
  in_overall: false
  group: style
  framework: [AUT]
  main_metric: Fluency, originality (AI-rated)
  biases: [AI rater bias, validity unproven]
  sources:
    - https://doi.org/10.3758/s13428-020-01453-w  # Beaty & Johnson 2021, SemDis scoring
    - https://doi.org/10.1016/j.tsc.2023.101356  # Organisciak et al. 2023, LLM scoring of uses

# Added in the WP4.4 extensibility drill (docs/plan/05, "As built (WP4.4)").
- id: timing
  name: Rhythm and timing
  plain: Feeling a steady beat
  badge: experimental
  in_overall: false
  group: speed
  framework: [CHC:Ga, CHC:U8, anisochrony_detection]
  main_metric: Accuracy telling on-beat from off-beat, by size of the shift
  biases: [musical training, sound off or hard to hear, screen and device timing jitter]
  note: New and not yet checked against other measures, so it never enters an overall score.
  sources:
    - https://doi.org/10.1016/j.bandc.2004.09.014  # Ehrlé & Samson (2005), anisochrony
    - https://doi.org/10.3758/BF03206433  # Repp (2005), tapping review
    - https://doi.org/10.3758/s13423-012-0371-2  # Repp & Su (2013), tapping review 2006-2012
