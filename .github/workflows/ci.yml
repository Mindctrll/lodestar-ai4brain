name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: najma
          POSTGRES_PASSWORD: najma
          POSTGRES_DB: najma
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U najma" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      NAJMA_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.19"
      - run: uv sync --frozen --python 3.14
      - run: make lint-backend lint-language test-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: make lint-frontend test-frontend

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.19"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.14
      - run: npm ci --prefix frontend
      - run: make contracts
      - run: git diff --exit-code
