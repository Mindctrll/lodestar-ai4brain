# Quick Draw (simple and choice reaction time). Difficulty knobs come from
# registry/games/quick_draw.yaml; this file holds the browser-side settings.
trials: 12
keys: [d, f, j, k]
single_key: ' '
foreperiod_ms: [600, 1500]
# Device-lag calibration before the round when measuring (onboarding, check-ups).
tap_in_time: { beats: 10, period_ms: 600 }
