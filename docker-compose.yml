# `make up` starts everything; `make up-ollama` also starts a containerised Ollama.
# Image tags are pinned (docs/plan/02, Pinned versions).
name: najma

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-najma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-najma}
      POSTGRES_DB: ${POSTGRES_DB:-najma}
    ports:
      - "${NAJMA_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "${NAJMA_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-najma}:${POSTGRES_PASSWORD:-najma}@postgres:5432/${POSTGRES_DB:-najma}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      NAJMA_MEMORY_DIR: /app/memory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NAJMA_API_PORT:-8000}:8000"
    volumes:
      - najma_memory:/app/memory
      - najma_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: frontend
    ports:
      - "${NAJMA_WEB_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.6
    profiles: ["ollama"]
    ports:
      - "${NAJMA_OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  qdrant_data:
  najma_memory:
  najma_models:
  ollama_models:
