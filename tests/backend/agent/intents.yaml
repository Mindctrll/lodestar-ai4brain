# Labelled utterances for intent routing (WP2.11 "Done when"). Each has the intent kind and, where
# it matters, the slots the router must fill: a named game, a skill, skills turned down, "quick",
# and the converse tool. Written as people type, typos and all. Safety phrasings (diagnosis,
# medical advice, crisis) are in safety.yaml: they never reach the router.

# play ---------------------------------------------------------------------------------------
- {text: "let's play", kind: play}
- {text: "Start a round", kind: play}
- {text: "I'm ready", kind: play}
- {text: "go", kind: play}
- {text: "another one please", kind: play}
- {text: "one more game", kind: play}
- {text: "play Echo", kind: play, game: echo}
- {text: "can we do quick draw?", kind: play, game: quick_draw}
- {text: "I want to try Souk Rush", kind: play, game: souk_rush}
- {text: "Spot the AI's mistake please", kind: play, game: spot_the_mistake}
- {text: "let's do pattern gap", kind: play, game: pattern_gap}
- {text: "a memory game", kind: play, dim: working_memory}
- {text: "something for my focus", kind: play, dim: selective_attention}
- {text: "give me a logic puzzle", kind: play, dim: reasoning}
- {text: "train my reaction speed", kind: play, dim: processing_speed}
- {text: "practice numbers", kind: play, dim: numerical_thinking}
- {text: "a game about football", kind: play}
- {text: "something quick", kind: play, quick: true}
- {text: "a short one, I only have 2 minutes", kind: play, quick: true}
- {text: "warm me up", kind: play}
- {text: "challenge me", kind: play}
- {text: "play switch", kind: play, game: switch}

# declining a suggestion (UW3) ----------------------------------------------------------------
- {text: "Not memory today, something quick.", kind: play, avoid: [working_memory], quick: true}
- {text: "no memory games please", kind: play, avoid: [working_memory]}
- {text: "skip the maths", kind: play, avoid: [numerical_thinking]}
- {text: "anything but reasoning", kind: play, avoid: [reasoning]}
- {text: "I'm sick of speed games", kind: play, avoid: [processing_speed]}
- {text: "something other than focus", kind: play, avoid: [selective_attention]}
- {text: "I'd rather not do memory right now", kind: play, avoid: [working_memory]}
- {text: "not that one, give me something else", kind: play}

