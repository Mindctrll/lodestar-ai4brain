  - "I'm worried about my exam"
  - "am I getting better at memory?"
  - "is my focus better in the morning?"
  - "I'm bad at maths games"
  - "why is my speed lower today"
  - "how do I compare with other people?"
  - "I keep forgetting the market list, any tips?"
  - "can you make it easier?"
  - "I'm a bit stressed"
  - "this game is killing me haha"
  - "my brain hurts after pattern gap lol"
  - "what does working memory mean"
  - "is it normal that I'm slow in the morning"
  - "I slept badly, does that change my scores?"
  - "do you think I'll pass my exam?"
