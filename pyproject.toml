[project]
name = "ai4brain"
version = "0.1.0"
description = "Najma, the cognitive growth agent (CISTAC 1.0)"
readme = "README.md"
license = "MIT"
requires-python = "==3.14.*"
# Versions are pinned exactly as listed in docs/plan/02-architecture.md.
dependencies = [
    "fastapi==0.156.2",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "sqlalchemy[asyncio]==2.1.5",
    "alembic==1.20.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "langchain-core==1.6.12",
    "langchain-anthropic==1.7.6",
    "langchain-openai==1.7.2",
    "langchain-google-genai==4.4.2",
    "langchain-deepseek==1.1.1",
    "langchain-xai==1.3.0",
    "langchain-mistralai==1.1.6",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "ollama==0.6.3",
    "qdrant-client==1.19.1",
    "fastembed==0.9.0",
    "mcp==2.3.0",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "mapie==1.6.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "typer==0.27.3",
    "rich==15.0.0",
    "cryptography==50.0.2",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
whisper = ["faster-whisper==1.2.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-pyyaml==6.0.12.20260906",
    "hypothesis==6.170.5",
    "matplotlib==3.11.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["frontend", "docs", "backend/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/agent", "backend/scoring", "backend/contracts", "backend/registry", "backend/generation"]
plugins = ["pydantic.mypy"]
